<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Groove Sequencer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>SVG Groove Sequencer</h1>
    <div class="controls">
      <button id="loadJSON">Load Groove JSON</button>
      <button id="play">▶ Play</button>
      <button id="stop">⏹ Stop</button>
      <button id="export">⏎ Export MIDI</button>
    </div>
  </header>

  <main id="sequencer-container">
    <svg id="sequencer" viewBox="0 0 1280 480" preserveAspectRatio="xMidYMid meet"></svg>
  </main>

  <footer>
    <p>SVG Sequencer • JSON-driven groove visualizer</p>
  </footer>

  <script src="main.js" type="module"></script>
</body>
</html>
