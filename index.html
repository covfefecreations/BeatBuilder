<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Modular Beat Builder — Live MIDI & Quantize</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Tone.js -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.39/build/Tone.min.js"></script>
  <!-- MidiWriterJS for client-side MIDI export -->
  <script src="https://cdn.jsdelivr.net/npm/midi-writer-js@2.1.1/dist/browser/MidiWriter.min.js"></script>
</head>
<body>
  <div id="app">
    <h1>Modular Beat Builder</h1>

    <div class="controls">
      <button id="load-json">Load JSON</button>
      <button id="play">Play</button>
      <button id="stop">Stop</button>
      <button id="record-midi">Start MIDI Record</button>
      <button id="stop-midi">Stop MIDI Record</button>
      <select id="quantize">
        <option value="4n">Bar (4n)</option>
        <option value="8n">8th</option>
        <option value="16n" selected>16th</option>
        <option value="32n">32nd</option>
      </select>
      <button id="export-json">Export JSON</button>
      <button id="export-midi">Export MIDI</button>
    </div>

    <div id="sequencer" style="width:100%;height:520px;margin-top:16px;"></div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
