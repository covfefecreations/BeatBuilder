<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatBuilder v0.4.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Toolbar -->
    <header class="toolbar">
      <div class="logo">🎵 BeatBuilder</div>
      
      <div class="transport-controls">
        <button id="play-button" class="btn btn-primary">▶ Play</button>
        <button id="stop-button" class="btn">⏹ Stop</button>
        <input id="bpm-input" type="number" value="120" min="60" max="200" />
        <label>BPM</label>
      </div>

      <div class="toolbar-actions">
        <button id="library-toggle" class="btn btn-accent">📚 Library</button>
        <button id="export-json" class="btn">💾 JSON</button>
        <button id="export-midi" class="btn">🎹 MIDI</button>
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-content">
      
      <!-- Library Panel (Slides in from left) -->
      <aside id="library-panel" class="library-panel">
        <!-- PatternSelector will render here -->
      </aside>

      <!-- Sequencer Area -->
      <main class="sequencer-area">
        <div id="sequencer-container">
          <!-- VisualSequencer renders here -->
        </div>
      </main>

    </div>

    <!-- Status Bar -->
    <footer class="status-bar">
      <span id="status-bar">Ready</span>
      <span id="track-count">0 tracks</span>
    </footer>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
