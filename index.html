<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatBuilder v0.4.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- Top Header with Brand and Status -->
    <header class="toolbar">
      <div class="status-info">
        <span id="status-bar">Ready</span>
        <span class="separator">•</span>
        <span id="track-count">0 tracks</span>
      </div>

      <div class="brand-title">
        <h1>BEATBUILDER</h1>
      </div>

      <div class="toolbar-actions">
        <!-- Spacer for symmetry -->
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Sequencer Area -->
      <div class="sequencer-wrapper">
        <aside id="track-controls-container" class="track-controls-container">
          <!-- Track controls rendered by VisualSequencer will go here -->
        </aside>
        <main class="sequencer-area">
          <div id="sequencer-container">
            <!-- VisualSequencer renders here -->
          </div>
        </main>
      </div>
    </div>

    <!-- Library Panel (Fixed on right) -->
    <aside id="library-panel">
      <!-- PatternSelector will render here -->
    </aside>

    <!-- Footer Controls -->
    <footer class="footer-controls">
      <div class="transport-section">
        <button id="play-button" class="transport-btn play-btn">
          <span class="btn-icon">▶</span>
          <span class="btn-label">Play</span>
        </button>
        <button id="stop-button" class="transport-btn stop-btn">
          <span class="btn-icon">⏹</span>
          <span class="btn-label">Stop</span>
        </button>
        <div class="bpm-control">
          <input id="bpm-input" type="number" min="60" max="200" value="120">
          <label>BPM</label>
        </div>
      </div>
      <div class="export-section">
        <button id="export-json" class="export-btn">
          <span class="btn-icon">📄</span>
          <span class="btn-label">Export JSON</span>
        </button>
        <button id="export-midi" class="export-btn">
          <span class="btn-icon">🎹</span>
          <span class="btn-label">Export MIDI</span>
        </button>
      </div>
    </footer>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
