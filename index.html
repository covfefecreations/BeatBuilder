<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatBuilder v0.4.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Toolbar -->
    <header class="toolbar">
      <div class="logo">🎵 BeatBuilder</div>
      
      <div class="toolbar-actions">
        <!-- The library toggle is removed as the panel is now fixed -->
        <!-- The export buttons are moved to the footer -->
      </div>
    </header>

    <!-- Main Content Area -->
	    <div class="main-content">
	      <!-- The sequencer-wrapper will be a flex container to hold the track controls and the sequencer area side-by-side -->
	      
	      <!-- Library Panel (Fixed on right) -->
	      <aside id="library-panel">
	        <!-- PatternSelector will render here -->
	      </aside>

	      <!-- Sequencer Area -->
	      <div class="sequencer-wrapper">
	        <aside id="track-controls-container" class="track-controls-container">
	          <!-- Track controls rendered by VisualSequencer will go here -->
	        </aside>
	        <main class="sequencer-area">
	          <div id="sequencer-container">
	            <!-- VisualSequencer renders here -->
	          </div>
	        </main>
	      </div>

    </div>

    <!-- Footer (Controls) -->
    <footer>
      <div class="controls">
        <button id="play-button">▶ Play</button>
        <button id="stop-button">⏹ Stop</button>
        <input id="bpm-input" type="number" min="60" max="200" value="120"> BPM
      </div>
      <div class="exports">
        <button id="export-json">Export JSON</button>
        <button id="export-midi">Export MIDI</button>
      </div>
    </footer>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
